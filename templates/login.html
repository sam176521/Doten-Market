{% extends 'base.html' %}

{% block content %}

<h1>Connexion</h1>

<form method="POST">
    {% csrf_token %}

    <input type="text" name="username" placeholder="Nom utilisateur">
    <input type="password" name="password" placeholder="Mot de passe">

    <button type="submit">Se connecter</button>
</form>

{% endblock %}
