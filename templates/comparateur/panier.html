{% extends 'base.html' %}

{% block content %}

<h1>Mon Panier</h1>

{% for item in items %}
<div class="card">
    <h3>{{ item.produit.nom }}</h3>
    <p>Quantité : {{ item.quantite }}</p>
    <p>Total : {{ item.total }} $</p>
</div>
{% endfor %}

<h2>Total général : {{ total }} $</h2>

<a href="/paiement/">Passer au paiement</a>

{% endblock %}
