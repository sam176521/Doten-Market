{% extends 'base.html' %}

{% block content %}
<div class="modal-page">
    <section class="modal-card">
        <h2>Supprimer le produit</h2>
        <p>Voulez-vous vraiment supprimer {{ produit.nom }} ?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit">Supprimer</button>
            <a href="{% url 'vendeur_dashboard' %}" class="link">Annuler</a>
        </form>
    </section>
</div>
{% endblock %}
